name: Build Linux Binaries

# reusable workflow, do not add triggers
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build xiond-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubicloud-standard-4-arm' || 'ubicloud-standard-4' }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        arch:
          - amd64
          - arm64

    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Go Version
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Configure access to private Go modules
        env:
          PRIVATE_MODULES_TOKEN: ${{ secrets.PRIVATE_MODULES_TOKEN }}
        run: |
          if [ -z "${PRIVATE_MODULES_TOKEN}" ]; then
            echo "PRIVATE_MODULES_TOKEN is not set; it needs read access to burnt-labs/wasmd_priv and burnt-labs/wasmvm_priv" >&2
            exit 1
          fi
          # make build-local mounts ~/.netrc read-only into the goreleaser container.
          umask 077
          printf 'machine github.com\nlogin x-access-token\npassword %s\n' "${PRIVATE_MODULES_TOKEN}" > "${HOME}/.netrc"
          echo "GOPRIVATE=github.com/burnt-labs/wasmd_priv,github.com/burnt-labs/wasmvm_priv" >> "${GITHUB_ENV}"

      - name: Build Linux Binary
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
        run: |
          make build-${{ matrix.os }}-${{ matrix.arch }}

      - name: Verify Linux Binary
        run: |
          mapfile -t binaries < <(find dist -type f -name 'xiond-${{ matrix.os }}-${{ matrix.arch }}')
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo "Expected exactly one binary, found ${#binaries[@]}"
            printf '%s\n' "${binaries[@]}"
            exit 1
          fi

          binary="${binaries[0]}"
          file "$binary"
          "$binary" version --long | tee version.txt
          # The security release must be built against the private forks.
          grep -q "github.com/burnt-labs/wasmvm_priv/v3" version.txt
          grep -q "github.com/burnt-labs/wasmd_priv" version.txt

          if readelf -l "$binary" | grep -q INTERP; then
            echo "$binary unexpectedly has an ELF interpreter"
            exit 1
          fi
          if readelf -d "$binary" 2>&1 | grep -q NEEDED; then
            echo "$binary unexpectedly has dynamic dependencies"
            exit 1
          fi
          file "$binary" | grep -q 'statically linked'

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: xiond-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/**/xiond-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 30
          if-no-files-found: error
