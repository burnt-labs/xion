name: Build and Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Golang CI Lint
    uses: ./.github/workflows/golangci-lint.yaml
    secrets: inherit

  vulncheck:
    name: Vulnerability Scan
    uses: ./.github/workflows/govulncheck.yaml
    secrets: inherit

  update-swagger:
    name: Update Swagger
    uses: ./.github/workflows/update-swagger.yaml
    secrets: inherit

  unit-tests:
    name: Go Unit Tests
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  build-docker:
    name: Build Docker Images
    uses: ./.github/workflows/docker-build.yaml
    secrets: inherit

  # Same fixable HIGH/CRITICAL gate the release runs, on the images just
  # built. It logs in to Docker Hub, so it is skipped where those secrets are
  # not available (fork and Dependabot PRs); the release gate still applies.
  docker-scout:
    name: Docker Scout
    needs: build-docker
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    uses: ./.github/workflows/docker-scout.yaml
    secrets: inherit

  e2e-tests:
    name: E2E tests
    needs:
      - lint
      - vulncheck
      - update-swagger
      - unit-tests
      - build-docker
    uses: ./.github/workflows/e2e-tests.yaml
    secrets: inherit
