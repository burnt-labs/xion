name: Create Release
# Private security release: build the Linux binaries and attach them, with
# SHA-256 checksums, to a draft GitHub release in this repository. Nothing is
# pushed anywhere else (no Docker registries, Homebrew or package repositories).
# A draft release does not fire the release "published" event.

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
      - 'v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux Binaries
    uses: ./.github/workflows/binaries-linux.yaml
    secrets: inherit

  create-release:
    name: Create Draft GitHub Release
    needs: build-linux
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: xiond-linux-*
          merge-multiple: true

      - name: Collect binaries and checksums
        run: |
          mkdir -p release
          find dist -type f -name 'xiond-linux-*' -exec cp {} release/ \;
          test -f release/xiond-linux-amd64
          test -f release/xiond-linux-arm64
          chmod +x release/xiond-linux-*
          cd release
          sha256sum xiond-linux-* > "xiond-${GITHUB_REF_NAME}-checksums.txt"
          cat "xiond-${GITHUB_REF_NAME}-checksums.txt"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes "Private security release build of ${GITHUB_SHA}. Linux amd64 and arm64 binaries with SHA-256 checksums. Do not publish this release or share the binaries beyond the validator set before disclosure."
