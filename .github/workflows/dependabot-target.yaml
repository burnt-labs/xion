name: dependabot-target

# dependabot.yml is read from the default branch only and its target-branch
# is a static string, so this workflow reconciles it: find the highest
# numeric release/v* branch and open a PR against main when the value is
# stale. Runs weekly and on demand.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point dependabot at the highest release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(git ls-remote --heads origin 'release/v*' \
            | sed 's|.*refs/heads/||' \
            | grep -E '^release/v[0-9]+(\.[0-9]+)*$' \
            | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            echo "no release branches found" >&2
            exit 0
          fi
          current=$(sed -n 's/^ *target-branch: *//p' .github/dependabot.yml | head -n1)
          if [ "$current" = "$latest" ]; then
            echo "dependabot already targets $latest"
            exit 0
          fi
          sed -i "s|^\( *target-branch:\) .*|\1 $latest|" .github/dependabot.yml
          git switch -c automation/dependabot-target
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am "ci: point dependabot at $latest"
          git push -f -u origin automation/dependabot-target
          gh pr create --base main \
            --title "ci: point dependabot at $latest" \
            --body "Retargets dependabot version updates from \`$current\` to \`$latest\`, the highest numeric \`release/v*\` branch. Opened by the dependabot-target workflow; \`dependabot.yml\` is only read from the default branch, which is why this PR targets \`main\`." \
            || echo "PR already open; branch updated"
