name: Docker Scout

# reusable workflow, do not add triggers
on:
  workflow_call:
    inputs:
      image-name:
        description: >-
          Prefix of the saved image artifact, <image-name>-<os>-<arch>.tar.
        type: string
        required: false
        default: docker
      image-tag:
        description: Repository the saved image is tagged with, <image-tag>:<os>-<arch>.
        type: string
        required: false
        default: xion
  workflow_dispatch:

jobs:
  docker-scout:
    name: main
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        arch:
          - amd64
          - arm64

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Prepare environment
        env:
          # workflow_dispatch has no inputs, so fall back to the Docker build's names.
          IMAGE_NAME: ${{ inputs.image-name || 'docker' }}
          IMAGE_TAG: ${{ inputs.image-tag || 'xion' }}
        run: |
          echo "DOCKER_FN=${IMAGE_NAME}-${{ matrix.os }}-${{ matrix.arch }}.tar" | tee -a "$GITHUB_ENV"
          echo "SCOUT_IMAGE=${IMAGE_TAG}:${{ matrix.os }}-${{ matrix.arch }}" | tee -a "$GITHUB_ENV"

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}
          pattern: ${{ env.DOCKER_FN }}
          merge-multiple: true

      - name: Load images
        working-directory: ${{ runner.temp }}
        run: |
          ls -la
          docker load < ${{ env.DOCKER_FN }}

      - name: Run Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          only-fixed: true
          platform: ${{ matrix.os }}/${{ matrix.arch }}
          image: ${{ env.SCOUT_IMAGE }}
