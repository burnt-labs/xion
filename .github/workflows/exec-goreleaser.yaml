name: GoReleaser
# Run for new release tags only

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubicloud-standard-2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}
          pattern: xiond-*
          merge-multiple: true

      # upload-artifact keeps the path below the first wildcard, so each binary
      # arrives nested (xiond_<os>_<arch>_<variant>/bin/xiond-<os>-<arch>), and
      # merge-multiple puts those trees directly under runner.temp. Place every
      # binary where the prebuilt builder in .goreleaser/release.yaml reads it,
      # whatever depth it arrived at, and fail before GoReleaser if a target is
      # missing.
      - name: Move artifacts
        env:
          ARTIFACT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          declare -A VARIANTS=(
            ["linux_amd64"]="v1"
            ["linux_arm64"]="v8.0"
            ["darwin_amd64"]="v1"
            ["darwin_arm64"]="v8.0"
          )
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            os="${platform%%_*}"
            arch="${platform##*_}"
            name="xiond-${os}-${arch}"
            mapfile -t found < <(find "$ARTIFACT_DIR" -type f -name "$name")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "Expected exactly one $name artifact, found ${#found[@]}" >&2
              printf '%s\n' "${found[@]}" >&2
              exit 1
            fi
            dest="dist/xiond_${platform}_${VARIANTS[$platform]}/bin"
            mkdir -p "$dest"
            cp "${found[0]}" "$dest/$name"
            chmod +x "$dest/$name"
          done
          find dist -type f

      - name: Set Go Version
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Import package signing GPG key
        id: import_pkg_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Save GPG and RSA keys
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > /home/runner/.gnupg/sign.asc
          echo "${{ secrets.PEM_PRIVATE_KEY }}" > /home/runner/.gnupg/sign.pem

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.42.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine goreleaser skip flags
        id: skip-flags
        run: |
          SKIP="fury"
          # When the GitHub release is disabled (non-tag runs), homebrew formula
          # generation fails because it cannot resolve download URLs.
          if [ "${SKIP_GITHUB_RELEASE:-}" = "true" ]; then
            SKIP="fury,homebrew"
          fi
          echo "flags=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
          GPG_KEY_ID: ${{ steps.import_pkg_gpg.outputs.keyid }}
          GPG_KEY_PATH: /home/runner/.gnupg/sign.asc
          GPG_FINGERPRINT: ${{ steps.import_pkg_gpg.outputs.fingerprint }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PEM_KEY_PATH: /home/runner/.gnupg/sign.pem
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --config .goreleaser/release.yaml --skip=${{ steps.skip-flags.outputs.flags }}
