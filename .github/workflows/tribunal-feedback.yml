name: Tribunal feedback
on:
  # Rejections arrive as a checkbox tick, which GitHub reports as an edit.
  issue_comment:
    types: [edited]
  pull_request_review_comment:
    types: [edited]
  # Acceptances arrive as a push: GitHub's Commit suggestion button fires no
  # event of its own, so the run reads the branch and asks which findings'
  # suggestions are now in it.
  #
  # `pull_request_target`, not `pull_request`, because a fix can now land on
  # a fork's PR and only this trigger has the token to record that it did.
  # It is safe here for the reason that makes it dangerous elsewhere: this
  # job never checks out or runs the PR's code. It checks out the base
  # branch, runs the published image, and touches the head only through the
  # API — reading file contents to compare against a suggestion.
  pull_request_target:
    types: [synchronize]

concurrency:
  # One feedback run per pull request. Two quick pushes otherwise start two
  # runs that both see the same live control before either strikes it, and
  # both append an accept — the dispose-once invariant is enforced by that
  # rewrite, so the rewrite cannot race itself. Never cancel: a cancelled
  # run is a decision nobody recorded.
  group: tribunal-feedback-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  feedback:
    # Checkbox edits on tribunal comments, plus every push to any PR —
    # forks included, since a suggestion committed there is the same signal.
    # Never tribunal's own comment edits: posting as an App does trigger
    # workflows, unlike GITHUB_TOKEN, and every re-review rewrites the
    # summary.
    #
    # The marker alone is not a gate: anybody can post a comment carrying it
    # and then edit it, and that starts a job holding the App key and
    # `contents: write`. The controls this job acts on live only in comments
    # tribunal wrote, so the author is checked too — a Bot-typed account,
    # which nothing but an App can post as, narrowed to tribunal's own login
    # wherever TRIBUNAL_BOT_LOGIN names it. Unset, an expression cannot
    # resolve the App's slug, so the type test stands alone rather than a
    # guessed default silently skipping every rejection. Editing somebody
    # else's comment takes write access, so what is left through this branch
    # is the checkbox tick and very little else.
    #
    # `issue_comment` also fires on plain issues, which have no pull request
    # to record a decision against; the review-comment event carries no
    # `issue` at all and is a pull request by construction.
    if: >-
      github.event_name == 'pull_request_target' ||
      (contains(github.event.comment.body, 'tribunal:v1') &&
       github.event.comment.user.type == 'Bot' &&
       (vars.TRIBUNAL_BOT_LOGIN == '' ||
        github.event.comment.user.login == vars.TRIBUNAL_BOT_LOGIN) &&
       github.event.sender.type != 'Bot' &&
       (github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request))
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      id-token: write        # the OIDC token Workload Identity exchanges
      contents: write        # append to the data branch
      pull-requests: write   # read comments, rewrite their controls
      packages: read
    container:
      image: ghcr.io/burnt-labs/tribunal:latest
      credentials:
        # GITHUB_TOKEN can pull this package only from the repository the
        # package is linked to; anywhere else it is refused at the pull,
        # before a step runs. GHCR_READ_TOKEN — an organisation secret
        # holding a read:packages token — is what lets every other
        # repository pull it, present and future, since Actions access is a
        # list of named repositories with no org-wide grant behind it.
        # Unset, this is the ambient token and nothing changes. ghcr.io
        # authenticates on the token alone, so the username stands.
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # The base branch, which is what the default ref gives a
      # pull_request_target run. Never add `ref: ...head.sha` here: that is
      # exactly the combination — a fork's code checked out with the base
      # repo's secrets — this trigger is notorious for. Nothing in this job
      # needs the PR's tree; it reads the head through the API.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The App authored the finding comments this job strikes through, and
      # GitHub only lets an author edit their own comment. A rejection is
      # recorded whether or not the edit lands; a committed suggestion is
      # not, because the struck control is the only thing that stops the
      # next push from counting it again. No LLM credentials here: this job
      # never calls a model, and it has the widest trigger in the system.
      - name: Load the App identity
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          # This job wants the App identity and no model credentials — it
          # never calls a model and has the widest trigger in the system.
          # Workload Identity has no per-secret selection, so that narrowing
          # has to come from a narrower environment: point
          # OP_IDENTITY_ENVIRONMENT_ID at one holding the three
          # TRIBUNAL_GH_APP_* variables alone.
          #
          # One method, whichever this repository is provisioned for, and
          # OP_WORKLOAD_ID alone decides which. The action refuses two
          # methods at once, and it refuses a *partial* Workload Identity
          # configuration just as hard — `getWorkloadIdentityConfig` throws
          # unless all three of the variables below are set or none of them
          # are. So every one of the four is blanked by the same switch
          # rather than merely left to be ignored: a repository that has
          # OP_INTEGRATION_KEY sitting in its secrets for later would
          # otherwise fail this step the moment it was added.
          #
          # Workload Identity resolves none of the op:// references below.
          # It exchanges the runner's OIDC token and publishes every
          # variable of OP_ENVIRONMENT_ID under that variable's own name, so
          # the environment has to name its variables as the step that
          # reads them expects. The op:// lines are the service account's
          # path, and inert under Workload Identity.
          OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_WORKLOAD_ID != '' && (vars.OP_IDENTITY_ENVIRONMENT_ID || vars.OP_ENVIRONMENT_ID) || '' }}
          OP_INTEGRATION_KEY: ${{ vars.OP_WORKLOAD_ID != '' && secrets.OP_INTEGRATION_KEY || '' }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ vars.OP_WORKLOAD_ID == '' && secrets.OP_SERVICE_ACCOUNT_TOKEN || '' }}
          TRIBUNAL_GH_APP_ID: op://AgentVault/tribunal-github-app/client-id
          TRIBUNAL_GH_APP_INSTALLATION: op://AgentVault/tribunal-github-app/installation-id
          TRIBUNAL_GH_APP_KEY: op://AgentVault/tribunal-github-app/private-key
      - name: Process feedback
        run: tribunal feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIBUNAL_GH_APP_ID: ${{ steps.op.outputs.TRIBUNAL_GH_APP_ID }}
          TRIBUNAL_GH_APP_INSTALLATION: ${{ steps.op.outputs.TRIBUNAL_GH_APP_INSTALLATION }}
          TRIBUNAL_GH_APP_KEY: ${{ steps.op.outputs.TRIBUNAL_GH_APP_KEY }}
          ADDITIONAL_BOT_REVIEWERS: ${{ vars.ADDITIONAL_BOT_REVIEWERS }}
          # The login tribunal treats as its own. It is normally the
          # App's slug, read at runtime; this is the documented fallback
          # for when that read fails, and without it here the variable
          # the README asks for reaches only the workflow's `if`.
          TRIBUNAL_BOT_LOGIN: ${{ vars.TRIBUNAL_BOT_LOGIN }}
          TRIBUNAL_ROLE_MODELS: ${{ vars.TRIBUNAL_ROLE_MODELS }}
