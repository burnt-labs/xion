# Adversarial multi-agent review of every pull request, posted by the
# burnt-tribunal App: one review, each fix offered as a committable
# GitHub suggestion. Source and documentation: burnt-labs/tribunal.
#
# Needs three things on this repository:
#
#  1. 1Password credentials, in one of the two shapes the action takes.
#     Workload Identity — vars OP_WORKLOAD_ID and OP_ENVIRONMENT_ID, secret
#     OP_INTEGRATION_KEY — exchanges this job's OIDC token and leaves no
#     long-lived credential in the repository, which is the shape to prefer
#     on a public one. A service account token (OP_SERVICE_ACCOUNT_TOKEN)
#     is the other. Set OP_WORKLOAD_ID to switch: it is the single variable
#     every other credential here is gated on, because the action refuses
#     two methods at once and refuses half of one just as hard.
#  2. Pull access to the ghcr.io/burnt-labs/tribunal package. Either the
#     organisation shares a read:packages credential as the GHCR_READ_TOKEN
#     secret, which the container credentials below prefer and which covers
#     every repository at once, or this repository is added by name under
#     the package's Manage Actions access. Without one of the two the job
#     fails at container init, before a step runs.
#  3. The TRIBUNAL_MENTION variable, for the mention trigger.
name: Tribunal review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The manual trigger, and the only one GitHub leaves an App.
  #
  # There is no re-request arrow to wire up: the reviewer list is closed to
  # third-party Apps — Copilot is the exception GitHub built for itself —
  # and a POST to requested_reviewers naming an App is accepted and then
  # quietly dropped, so no review_requested event ever arrives. A mention in
  # a comment is what is left, which is why every other review App on a PR
  # is triggered by one.
  #
  # It fires only when vars.TRIBUNAL_MENTION holds the phrase to match
  # (`@burnt-tribunal`). Unset, no comment can start a run: the alternative
  # is an empty needle that every comment contains.
  issue_comment:
    types: [created]

jobs:
  review:
    # Job level, not workflow level. A run cancelled by this group is
    # cancelled before any `if` is evaluated, so a run this job skips — a
    # comment that is not a mention, on a busy PR — would join the group
    # and cancel the review that is doing the work. At job level the
    # skipped run never joins it.
    concurrency:
      group: tribunal-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # Two events, two shapes of the same question: is this a pull request of
    # ours, and did somebody ask for a review of it.
    #
    # Fork PRs get no secrets on `pull_request`, and tribunal's own fix and
    # merge branches are not reviewed (its docs PRs are ordinary content
    # changes and are).
    #
    # Dependabot is excluded here, which the source repository's copy does
    # not do: a grouped bump is a large diff with nothing in it a panel can
    # judge — the change is a version number, and whether it is safe lives
    # in the upstream changelog and the test run, not in these lines. Say
    # the mention phrase on one and it is reviewed like anything else.
    #
    # On a mention the gate is who is asking. A public repository lets
    # anyone comment, and a comment must not be able to spend the panel's
    # budget, so the run needs an account the project knows — the coarse
    # test, since `authorAssociation` reports MEMBER for write granted
    # through a team and never reports COLLABORATOR for it. Bots are
    # excluded outright: a review App quoting the mention phrase back at us
    # is a loop, and posting as an App triggers workflows where
    # GITHUB_TOKEN's writes do not.
    #
    # `user.type` alone does not cover that: the accounts in
    # ADDITIONAL_BOT_REVIEWERS are precisely the machine users GitHub types
    # as `User`, and one of those added to the org passes the association
    # test too. They are excluded by login, with the dispositions workflow's
    # two-delimiter membership test — `resolve_run` splits the variable on a
    # comma *or* whitespace and expressions have no `replace` to normalise
    # one into the other, so both forms are checked, and both delimiters on
    # both sides keep `bot` from matching `bot-a`.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'tribunal/fix/') &&
       !startsWith(github.event.pull_request.head.ref, 'tribunal/merge/') &&
       !startsWith(github.event.pull_request.head.ref, 'dependabot/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       vars.TRIBUNAL_MENTION != '' &&
       contains(github.event.comment.body, vars.TRIBUNAL_MENTION) &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.user.login !=
         (vars.TRIBUNAL_BOT_LOGIN || 'github-actions[bot]') &&
       !contains(format(',{0},', vars.ADDITIONAL_BOT_REVIEWERS),
                 format(',{0},', github.event.comment.user.login)) &&
       !contains(format(' {0} ', vars.ADDITIONAL_BOT_REVIEWERS),
                 format(' {0} ', github.event.comment.user.login)) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    permissions:
      id-token: write        # the OIDC token Workload Identity exchanges
      contents: write        # push the mediator's conflict resolution
      pull-requests: write   # post the review and its suggestions
      packages: read         # pull the private container image
      issues: read           # linked issues, for the acceptance section
    container:
      image: ghcr.io/burnt-labs/tribunal:latest
      credentials:
        # GITHUB_TOKEN can pull this package only from the repository the
        # package is linked to; anywhere else it is refused at the pull,
        # before a step runs. GHCR_READ_TOKEN — an organisation secret
        # holding a read:packages token — is what lets every other
        # repository pull it, present and future, since Actions access is a
        # list of named repositories with no org-wide grant behind it.
        # Unset, this is the ambient token and nothing changes. ghcr.io
        # authenticates on the token alone, so the username stands.
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # The head the run is about. `pull_request` carries it in the payload;
      # `issue_comment` carries no head at all — as far as that event is
      # concerned the comment is on an issue — so it has to be asked for,
      # and the same answer carries the two checks `pull_request` gets from
      # its payload in the `if` above. A mention on a fork's PR reviews
      # nothing: this job checks out the head and runs agents over it with
      # the repository's secrets in the environment. And a mention on
      # tribunal's own fix or merge branch reviews nothing either, for the
      # same reason the other trigger excludes them.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PAYLOAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PAYLOAD_SHA" ]; then
            echo "sha=$PAYLOAD_SHA" >> "$GITHUB_OUTPUT"
            echo "review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                 --json headRefOid,isCrossRepository,headRefName \
                 --jq '[.headRefOid, (.isCrossRepository | tostring), .headRefName] | @tsv')
          IFS=$'\t' read -r sha fork ref <<<"$pr"
          if [ "$fork" = "true" ]; then
            echo "::notice::mentioned on a fork's pull request; not reviewing"
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ref" in
            tribunal/fix/*|tribunal/merge/*)
              echo "::notice::mentioned on tribunal's own $ref; not reviewing"
              echo "review=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "review=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.pr.outputs.review == 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.sha }}
      - name: Load LLM credentials
        id: op
        if: steps.pr.outputs.review == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          # Step outputs, not $GITHUB_ENV: exporting put the LLM
          # tokens in the environment of every later step in the job,
          # including any action added here in future, alongside a
          # checkout of the code under review.
          export-env: false
        env:
          # One method, whichever this repository is provisioned for, and
          # OP_WORKLOAD_ID alone decides which. The action refuses two
          # methods at once, and it refuses a *partial* Workload Identity
          # configuration just as hard — `getWorkloadIdentityConfig` throws
          # unless all three of the variables below are set or none of them
          # are. So every one of the four is blanked by the same switch
          # rather than merely left to be ignored: a repository that has
          # OP_INTEGRATION_KEY sitting in its secrets for later would
          # otherwise fail this step the moment it was added.
          #
          # Workload Identity resolves none of the op:// references below.
          # It exchanges the runner's OIDC token and publishes every
          # variable of OP_ENVIRONMENT_ID under that variable's own name, so
          # the environment has to name its variables as the step that
          # reads them expects. The op:// lines are the service account's
          # path, and inert under Workload Identity.
          OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_WORKLOAD_ID != '' && vars.OP_ENVIRONMENT_ID || '' }}
          OP_INTEGRATION_KEY: ${{ vars.OP_WORKLOAD_ID != '' && secrets.OP_INTEGRATION_KEY || '' }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ vars.OP_WORKLOAD_ID == '' && secrets.OP_SERVICE_ACCOUNT_TOKEN || '' }}
          ANTHROPIC_AUTH_TOKEN: op://AgentVault/tribunal-llm/anthropic-auth-token
          ANTHROPIC_BASE_URL: op://AgentVault/tribunal-llm/anthropic-base-url
          OPENAI_API_KEY: op://AgentVault/tribunal-llm/openai-api-key
          OPENAI_BASE_URL: op://AgentVault/tribunal-llm/openai-base-url
          TRIBUNAL_ANTHROPIC_MODEL: op://AgentVault/tribunal-llm/anthropic-model
          TRIBUNAL_OPENAI_MODEL: op://AgentVault/tribunal-llm/openai-model
          TRIBUNAL_GH_APP_ID: op://AgentVault/tribunal-github-app/client-id
          TRIBUNAL_GH_APP_INSTALLATION: op://AgentVault/tribunal-github-app/installation-id
          TRIBUNAL_GH_APP_KEY: op://AgentVault/tribunal-github-app/private-key
      - name: Review
        if: steps.pr.outputs.review == 'true'
        run: tribunal review --pr "$PR"
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDITIONAL_BOT_REVIEWERS: ${{ vars.ADDITIONAL_BOT_REVIEWERS }}
          # The login tribunal treats as its own. It is normally the
          # App's slug, read at runtime; this is the documented fallback
          # for when that read fails, and without it here the variable
          # the README asks for reaches only the workflow's `if`.
          TRIBUNAL_BOT_LOGIN: ${{ vars.TRIBUNAL_BOT_LOGIN }}
          TRIBUNAL_ROLE_MODELS: ${{ vars.TRIBUNAL_ROLE_MODELS }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.op.outputs.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ steps.op.outputs.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ steps.op.outputs.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ steps.op.outputs.OPENAI_BASE_URL }}
          TRIBUNAL_ANTHROPIC_MODEL: ${{ steps.op.outputs.TRIBUNAL_ANTHROPIC_MODEL }}
          TRIBUNAL_OPENAI_MODEL: ${{ steps.op.outputs.TRIBUNAL_OPENAI_MODEL }}
          TRIBUNAL_GH_APP_ID: ${{ steps.op.outputs.TRIBUNAL_GH_APP_ID }}
          TRIBUNAL_GH_APP_INSTALLATION: ${{ steps.op.outputs.TRIBUNAL_GH_APP_INSTALLATION }}
          TRIBUNAL_GH_APP_KEY: ${{ steps.op.outputs.TRIBUNAL_GH_APP_KEY }}
