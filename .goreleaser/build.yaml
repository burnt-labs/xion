version: 2

project_name: xiond

# Docs: https://goreleaser.com/customization/hooks/
before:
  hooks:
    # All Linux/arm64 CGo compilation and final linking use the same pinned Zig
    # musl toolchain. Installing it for every target keeps multi-target builds
    # deterministic; non-arm64 targets continue to use their existing compilers.
    - ./scripts/install-zig.sh /opt/zig-0.14.1
    # barretenberg-go links -lc++; the goreleaser-cross image has no libc++.
    - ./scripts/install-libcxx.sh

# Docs: https://goreleaser.com/customization/build/
builds:
  - id: xiond
    goos:
      - linux
      - darwin
      # - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm:
      - v8.0
    main: ./cmd/xiond
    binary: bin/xiond-{{ .Os }}-{{ .Arch }}
    hooks:
      pre:
        - cmd: mkdir -p {{ .Env.LIB_PATH }}
        # Stage libwasmvm from the (private) wasmvm module: the fork ships the
        # muslc static libs as .xz inside internal/api. Fall back to a plain
        # file or a pre-downloaded /tmp/wasmvm copy; never fetch from public releases.
        # Also copy into the module dir so the linker finds it via the module's own -L path.
        - cmd: sh -c '[ "{{ .Os }}" = "windows" ] && exit 0; WASM_DIR=$(go list -m -json github.com/CosmWasm/wasmvm/v3 | grep "\"Dir\"" | head -1 | cut -d"\"" -f4); SRC="$WASM_DIR/internal/api/{{ .Env.WASM_LIB }}"; if [ -f "$SRC.xz" ]; then unxz -c "$SRC.xz" > {{ .Env.LIB_PATH }}/{{ .Env.WASM_LIB }}; elif [ -f "$SRC" ]; then cp "$SRC" {{ .Env.LIB_PATH }}/{{ .Env.WASM_LIB }}; elif [ -f /tmp/wasmvm/{{ .Env.WASM_LIB }} ]; then cp /tmp/wasmvm/{{ .Env.WASM_LIB }} {{ .Env.LIB_PATH }}/{{ .Env.WASM_LIB }}; else echo "{{ .Env.WASM_LIB }} not found in the wasmvm module ($WASM_DIR) or /tmp/wasmvm" >&2; exit 1; fi; chmod -R u+w "$WASM_DIR" 2>/dev/null || true; cp {{ .Env.LIB_PATH }}/{{ .Env.WASM_LIB }} "$SRC" 2>/dev/null || true'
        # Replace the module's LFS pointer with a checksum-verified release
        # archive. Linux/arm64 deliberately selects the separately published
        # musl archive while retaining the module's expected library path.
        - cmd: sh -c 'BB_VER=$(awk '\''$1 == "github.com/burnt-labs/barretenberg-go" { print $2; exit }'\'' go.mod); BB_DIR=$(go mod download -json "github.com/burnt-labs/barretenberg-go@$BB_VER" | awk -F'\''"'\'' '\''/"Dir"/ { print $4; exit }'\''); [ -n "$BB_DIR" ] || { echo "failed to resolve the barretenberg-go module directory" >&2; exit 1; }; ./scripts/download-barretenberg.sh {{ .Os }} {{ .Arch }} "$BB_DIR/lib/{{ .Os }}_{{ .Arch }}/libbarretenberg.a" {{ if and (eq .Os "linux") (eq .Arch "arm64") }}musl{{ else }}gnu{{ end }}'
        - cmd: echo Starting build...
    ldflags:
      - -X main.Date={{ .CommitDate }}
      - -X github.com/cosmos/cosmos-sdk/version.Name={{ .ProjectName }}
      - -X github.com/cosmos/cosmos-sdk/version.AppName={{ .ProjectName }}
      - -X github.com/cosmos/cosmos-sdk/version.Version=v{{ .Version }}
      - -X github.com/cosmos/cosmos-sdk/version.Commit={{ .Commit }}
      - -X github.com/cosmos/cosmos-sdk/version.BuildTags=netgo,ledger
      - -w -s
      - -linkmode=external
      - >-
        {{- if eq .Os "linux" -}}
          -extldflags '-static -lm'
        {{- end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - netgo
      - ledger
      - static_wasm
      - muslc
      - >-
        {{- if eq .Os "linux" -}}
          osusergo
        {{- end }}
    flags:
      - -mod=readonly
      - -trimpath
    env:
      - CGO_ENABLED=1
      - CGO_LDFLAGS='-L./dist/lib'
      - LIB_PATH=./dist/lib
      - >-
        {{- if eq .Os "darwin" }}MACOSX_DEPLOYMENT_TARGET=10.12{{- end }}
      - >-
        {{- if eq .Os "darwin" }}WASM_LIB=libwasmvmstatic_darwin.a{{- end }}
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}WASM_LIB=libwasmvm_muslc.x86_64.a{{- end }}
          {{- if eq .Arch "arm64" }}WASM_LIB=libwasmvm_muslc.aarch64.a{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}WASM_LIB=​wasmvm.dll{{- end }}
      - >-
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CC=o64-clang{{- end }}
          {{- if eq .Arch "arm64" }}CC=oa64-clang{{- end }}
        {{- end }}
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=/opt/zig-0.14.1/bin/aarch64-linux-musl-zig-cc{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-w64-mingw32-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc{{- end }}
        {{- end }}
      - >-
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CXX=o64-clang++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=oa64-clang++{{- end }}
        {{- end }}
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CXX=x86_64-linux-gnu-g++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=/opt/zig-0.14.1/bin/aarch64-linux-musl-zig-c++{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CXX=x86_64-w64-mingw32-g++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=/llvm-mingw/bin/aarch64-w64-mingw32-g++{{- end }}
        {{- end }}
